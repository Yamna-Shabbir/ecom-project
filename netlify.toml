# Netlify — leave "Base directory" empty in the UI; use these settings
[build]
  command = "npm run build"
  publish = "frontend/build"

[build.environment]
  NODE_VERSION = "20"
  CI = "false"

# React Router — all routes serve index.html
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
